query CartLinesInput {
  presentmentCurrencyRate
  localization {
    country {
      isoCode
    }
    language {
      isoCode
    }
  }
  shop {
    localTime {
      date
    }
  }
  cart {
    cost {
      subtotalAmount {
        currencyCode
      }
    }
    lines {
      id
      quantity
      cost {
        amountPerQuantity {
          amount
        }
        subtotalAmount {
          amount
        }
      }
      gift: attribute(key: "_cartkit_gift") {
        value
      }
      merchandise {
        __typename
        ... on ProductVariant {
          id
          product {
            id
          }
        }
      }
    }
  }
  discount {
    discountClasses
    metafield(namespace: "$app:cartkit", key: "function-configuration") {
      jsonValue
    }
  }
}
