<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Cartivo">
  <!-- Cartivo mark: a "C" that is also a shopping cart (two wheels), with a sparkle for rewards and offers.
       Brand colours from app/styles/admin.css: indigo #4f46e5, pink #db2777. Solid background (no gradient). -->
  <rect width="100" height="100" rx="24" fill="#4f46e5"/>
  <!-- cart handle -->
  <path d="M17 27 h9" stroke="#ffffff" stroke-width="7" stroke-linecap="round"/>
  <!-- the C / cart basket -->
  <path d="M68.4 33.6 A22 22 0 1 0 68.4 62.4" fill="none" stroke="#ffffff" stroke-width="11" stroke-linecap="round"/>
  <path d="M26 27 L30.5 36" stroke="#ffffff" stroke-width="7" stroke-linecap="round"/>
  <!-- wheels -->
  <circle cx="41" cy="80" r="5.5" fill="#ffffff"/>
  <circle cx="62" cy="80" r="5.5" fill="#ffffff"/>
  <!-- reward sparkle in the opening of the C -->
  <path d="M74 38 C75.2 45 76 45.8 83 47 C76 48.2 75.2 49 74 56 C72.8 49 72 48.2 65 47 C72 45.8 72.8 45 74 38 Z" fill="#f9a8d4"/>
  <circle cx="83.5" cy="33.5" r="3" fill="#f9a8d4"/>
</svg>
